<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
</head>
<body>
    {% for student in students %}   
    <p> {{ student.name }}</p>
    <p> {{ student.email }}</p>
    <p> {{ student.phone }}</p>
    <p> {{ student.address }}</p>
    <p> {{ student.profile_image }}</p>
    {% endfor %}
</body>
</html>
